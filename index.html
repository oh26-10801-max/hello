<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>잭팟 게임</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111 0%, #3b0 40%, #111 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: min(480px, 90vw);
            padding: 24px;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.65);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h1 {
            margin-bottom: 12px;
            font-size: clamp(2rem, 3vw, 3rem);
            letter-spacing: 0.06em;
        }

        p {
            margin: 0 0 20px;
            color: #dce2ff;
        }

        .reels {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 22px;
        }

        .reel {
            width: 100px;
            height: 100px;
            border-radius: 18px;
            background: #0e1b0f;
            border: 2px solid rgba(255, 255, 255, 0.15);
            display: grid;
            place-items: center;
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4);
        }

        button {
            border: none;
            border-radius: 999px;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #fff 0%, #efe 100%);
            color: #082;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 28px rgba(0, 0, 0, 0.25);
        }

        .stats {
            display: grid;
            gap: 10px;
            margin-top: 20px;
            text-align: left;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 10px 14px;
            color: #c9f2c9;
        }

        .message {
            min-height: 34px;
            margin-top: 16px;
            font-size: 1rem;
            font-weight: 700;
            color: #fdff80;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>잭팟 게임</h1>
        <p>버튼을 눌러 릴을 돌리고 3개의 숫자를 맞춰보세요. 잭팟은 777입니다!</p>
        <div class="reels" id="reels">
            <div class="reel" id="reel1">0</div>
            <div class="reel" id="reel2">0</div>
            <div class="reel" id="reel3">0</div>
        </div>
        <button id="spinButton">스핀</button>
        <div class="message" id="message">행운을 빌어요!</div>
        <div class="stats">
            <div class="stat-item"><span>남은 코인</span><strong id="coins">100</strong></div>
            <div class="stat-item"><span>총 베팅</span><strong id="bet">10</strong></div>
            <div class="stat-item"><span>현재 보너스</span><strong id="bonus">0</strong></div>
        </div>
    </div>

    <script>
        const reels = [
            document.getElementById('reel1'),
            document.getElementById('reel2'),
            document.getElementById('reel3')
        ];
        const spinButton = document.getElementById('spinButton');
        const messageEl = document.getElementById('message');
        const coinsEl = document.getElementById('coins');
        const betEl = document.getElementById('bet');
        const bonusEl = document.getElementById('bonus');

        let coins = 100;
        const bet = 10;
        let bonus = 0;
        let spinning = false;

        function updateStats() {
            coinsEl.textContent = coins;
            betEl.textContent = bet;
            bonusEl.textContent = bonus;
        }

        function getRandomSymbol() {
            return Math.floor(Math.random() * 9) + 1;
        }

        function spinReels() {
            if (spinning) return;
            if (coins < bet) {
                messageEl.textContent = '코인이 부족합니다. 게임을 재시작하세요.';
                return;
            }

            spinning = true;
            coins -= bet;
            bonus = 0;
            updateStats();
            messageEl.textContent = '릴이 돌고 있어요...';

            const finalSymbols = [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()];
            const duration = 1200;
            const start = performance.now();

            function animate(time) {
                const elapsed = time - start;
                for (let i = 0; i < reels.length; i += 1) {
                    const progress = Math.min(1, Math.max(0, (elapsed - i * 150) / duration));
                    if (progress < 1) {
                        reels[i].textContent = getRandomSymbol();
                    } else {
                        reels[i].textContent = finalSymbols[i];
                    }
                }

                if (elapsed < duration + 300) {
                    requestAnimationFrame(animate);
                } else {
                    finishSpin(finalSymbols);
                }
            }

            requestAnimationFrame(animate);
        }

        function finishSpin(symbols) {
            const [a, b, c] = symbols;
            if (a === 7 && b === 7 && c === 7) {
                coins += 500;
                messageEl.textContent = '잭팟! 500 코인을 획득했습니다!';
            } else if (a === b && b === c) {
                coins += 150;
                messageEl.textContent = `트리플 매치! ${a} ${a} ${a} - 150 코인 획득!`;
            } else if (a === b || b === c || a === c) {
                coins += 50;
                messageEl.textContent = `더블 매치! ${symbols.join(' ')} - 50 코인 획득!`;
            } else {
                messageEl.textContent = `아쉽네요... ${symbols.join(' ')}. 다음 기회에!`;
            }

            if (symbols.includes(7)) {
                bonus += 5;
                messageEl.textContent += ' 7 보너스 +5!';
            }

            bonus = Math.min(100, bonus);
            coins += bonus;
            updateStats();
            spinning = false;
        }

        spinButton.addEventListener('click', spinReels);
        updateStats();
    </script>
</body>
</html>
